stages:
  - plan
  - create
  - verify
  - secure
  - package
  - release
  - configure
  - monitor
  - govern

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONDONTWRITEBYTECODE: "1"

default:
  interruptible: true

.python:
  image: python:3.12-slim
  cache:
    key:
      files:
        - requirements-dev.txt
    paths:
      - .cache/pip
  before_script:
    - python --version
    - pip install --quiet --upgrade pip

# ---------------------------------------------------------------- plan
plan:contract:
  stage: plan
  extends: .python
  script:
    - test -f autonomy.yaml
    - test -f .gitlab/issue_templates/ship.md
    - test -f .gitlab/duo/flows/radius_triage_plan.yaml
    - pip install --quiet pyyaml==6.0.2
    - python -c "import yaml; d=yaml.safe_load(open('autonomy.yaml')); assert d['kind']=='AutonomyContract', 'not an AutonomyContract'; assert d['spec']['budgets']['error_rate_max'] > 0"
    - echo "Contract, issue template and flow source are present."

# ---------------------------------------------------------------- create
create:flow-lint:
  stage: create
  extends: .python
  script:
    - pip install --quiet pyyaml==6.0.2
    - python scripts/lint_flows.py --require-files

# ---------------------------------------------------------------- verify
verify:lint:
  stage: verify
  extends: .python
  script:
    - pip install --quiet ruff==0.8.4
    - ruff check .

verify:test:
  stage: verify
  extends: .python
  script:
    - pip install --quiet -r requirements-dev.txt
    - pytest -q --junitxml=report.xml --cov=app --cov=policy --cov-report=term --cov-report=xml
  coverage: '/TOTAL.*\s+(\d+)%/'
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

verify:policy:
  stage: verify
  extends: .python
  script:
    - pip install --quiet pyyaml==6.0.2
    - python policy/check.py --action deploy --error-rate 0.0 --latency-p95-ms 120 --spend-usd 0.5 --change-lines 10 --data-class internal --format text
    - |
      set +e
      python policy/check.py --action promote --error-rate 0.60 --latency-p95-ms 120 --spend-usd 0.5 --change-lines 10 --data-class internal --format text
      code=$?
      set -e
      test "$code" -eq 2
      echo "Error-budget breach correctly denied (exit 2)."
    - |
      set +e
      python policy/check.py --action merge --now 2026-10-31T12:00:00Z --error-rate 0.0 --latency-p95-ms 120 --spend-usd 0.5 --change-lines 10 --data-class internal --format text
      code=$?
      set -e
      test "$code" -eq 2
      echo "Freeze window correctly denied (exit 2)."

# ---------------------------------------------------------------- secure
secure:secrets:
  stage: secure
  image:
    name: zricethezav/gitleaks:v8.21.2
    entrypoint: [""]
  script:
    - gitleaks detect --source . --no-git --redact --verbose

secure:deps:
  stage: secure
  extends: .python
  allow_failure: true
  script:
    - pip install --quiet pip-audit==2.7.3
    - pip-audit -r app/requirements.txt

secure:sast:
  stage: secure
  image:
    name: semgrep/semgrep:1.101.0
    entrypoint: [""]
  allow_failure: true
  script:
    - semgrep scan --config p/python --severity ERROR --error app policy scripts

# ---------------------------------------------------------------- package
package:wheel:
  stage: package
  extends: .python
  script:
    - pip install --quiet build==1.2.2 cyclonedx-bom
    - python -m build --wheel
    - cp dist/radius_demo-*.whl "dist/radius-demo-${CI_COMMIT_SHORT_SHA}.whl"
    - cyclonedx-py environment -o dist/sbom.cdx.json
    - ls -lh dist/
  artifacts:
    paths:
      - dist/

# Publishing is evidence, not a dependency: a registry outage must not stop the
# release loop. The canary consumes the wheel from this job's artifacts.
package:publish:
  stage: package
  extends: .python
  allow_failure: true
  needs:
    - job: package:wheel
      artifacts: true
  script:
    - |
      curl --fail --silent --show-error --retry 3 \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file "dist/radius-demo-${CI_COMMIT_SHORT_SHA}.whl" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/radius/${CI_COMMIT_SHORT_SHA}/radius-demo-${CI_COMMIT_SHORT_SHA}.whl"
    - echo "published radius-demo-${CI_COMMIT_SHORT_SHA}.whl"

# ---------------------------------------------------------------- release
release:create:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - echo "Creating release v0.1.${CI_PIPELINE_IID} from pipeline ${CI_PIPELINE_ID}"
  release:
    tag_name: "v0.1.${CI_PIPELINE_IID}"
    name: "Radius v0.1.${CI_PIPELINE_IID}"
    description: "Automated release from pipeline ${CI_PIPELINE_ID}. Policy-gated canary, verified rollback and a machine-readable evidence pack."

# ---------------------------------------------------------------- configure
configure:render:
  stage: configure
  extends: .python
  script:
    - pip install --quiet pyyaml==6.0.2
    - python scripts/render_config.py
    - python policy/check.py --action deploy --error-rate 0.0 --latency-p95-ms 120 --spend-usd 0.5 --change-lines 10 --data-class internal --format text
    - cat deploy/runtime.env
  artifacts:
    paths:
      - deploy/

# ---------------------------------------------------------------- monitor
.canary:
  stage: monitor
  extends: .python
  needs:
    - job: package:wheel
      artifacts: true
    - job: configure:render
      artifacts: true
  script:
    - pip install --quiet -r requirements-dev.txt
    - export CHAOS_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(16))')"
    - python scripts/canary.py --candidate-wheel "dist/radius-demo-${CI_COMMIT_SHORT_SHA}.whl" "$@"
  artifacts:
    when: always
    paths:
      - evidence/
    expire_in: 1 week

monitor:canary:
  extends: .canary
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - when: on_success
  script:
    - pip install --quiet -r requirements-dev.txt
    - export CHAOS_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(16))')"
    - bash scripts/ci_canary.sh breach 30

monitor:healthy:
  extends: .canary
  when: manual
  allow_failure: true
  script:
    - pip install --quiet -r requirements-dev.txt
    - export CHAOS_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(16))')"
    - bash scripts/ci_canary.sh clean 15

# ---------------------------------------------------------------- govern
govern:report:
  stage: govern
  extends: .python
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - when: on_success
  needs:
    - job: monitor:canary
      artifacts: true
    - job: configure:render
      artifacts: true
  script:
    - pip install --quiet pyyaml==6.0.2
    - python scripts/stage_report.py
    - python scripts/check_stages.py
    - cat evidence/REPORT.md
  artifacts:
    paths:
      - evidence/REPORT.md
      - evidence/canary.json
      - deploy/runtime.json
